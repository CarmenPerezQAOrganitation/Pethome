<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos | PetHome</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <nav>

        <a href="index.html" id="logo">
            <h1>🐾 PetHome</h1>
        </a>

        <ul>

            <li><a href="index.html">Inicio</a></li>

            <li><a href="products.html">Productos</a></li>

            <li><a href="contact.html">Contacto</a></li>

            <li><a href="#">Mi Cuenta</a></li>

            <li><a href="#">🛒 Carrito</a></li>

        </ul>

    </nav>

</header>

<main>

    <section>

        <h2>Catálogo de productos</h2>

        <p style="text-align:center; margin-bottom:40px;">
            Encuentra todo lo que necesita tu mascota.
        </p>

    </section>

    <!-- FILTROS -->

    <section id="filters">

        <h3>Filtros</h3>

        <form>

            <label for="search-name">
                Nombre
            </label>

            <input
                type="search"
                id="search-name"
                placeholder="Buscar producto">

            <label for="category">
                Categoría
            </label>

            <select id="category">

                <option value="">Todas</option>

                <option value="Perros">Perros</option>

                <option value="Gatos">Gatos</option>

                <option value="Pájaros">Pájaros</option>

                <option value="Peces">Peces</option>

                <option value="Roedores">Roedores</option>

            </select>

            <label for="min-price">
                Precio mínimo
            </label>

            <input
                type="number"
                id="min-price"
                min="0">

            <label for="max-price">
                Precio máximo
            </label>

            <input
                type="number"
                id="max-price"
                min="0">

            <button type="button" id="btn-filter">
                Filtrar
            </button>

            <button type="reset">
                Quitar filtros
            </button>

        </form>

    </section>

    <!-- PRODUCTOS -->

    <section>

        <div id="products-container">

            <!-- JavaScript insertará aquí los productos -->

        </div>

    </section>

</main>

<footer>

    <p>© 2026 PetHome</p>

    <p>Proyecto para practicar QA Manual y QA Automation.</p>

</footer>

<script src="js/products.js"></script>

</body>

</html>
